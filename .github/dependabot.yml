version: 2

multi-ecosystem-groups:
  vite-plugin-relay-deps:
    schedule:
      interval: "daily"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "vite-plugin-relay-deps"
    patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/"
    multi-ecosystem-group: "vite-plugin-relay-deps"
    patterns: ["*"]
    # Related packages have to move together anyway: a lone `react-relay` or
    # `relay-runtime` major bump breaks the example because the two versions
    # stop matching.
    ignore:
      # TypeScript 7 is the native compiler and no longer ships the JavaScript
      # compiler API. tsup's `--dts` step (rollup-plugin-dts) and
      # typescript-eslint both depend on it, so upgrading breaks the build and
      # lint. Drop this once those tools support TypeScript >= 6.1.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

